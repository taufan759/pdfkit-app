[package]
name = "pdfkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDF operations behind PDFKit: merge, split, compress, rotate, watermark and more."

[dependencies]
getrandom = "0.4"
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
lopdf = "0.47"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
